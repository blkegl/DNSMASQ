name: Update DNSmasq List

on:
  schedule:
    # Runs at 21:00 UTC every day (which is 3:00 AM BST)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run Aggregation Script
      run: python generate_dnsmasq.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 1. Force stage all the newly generated dnsmasq files
        git add -A dnsmasq*.txt
        
        # 2. Append a timestamp or specific run ID to the message 
        #    so the commit metadata is unique every run
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        
        # 3. Unconditionally commit
        git commit --allow-empty -m "chore: auto-update dnsmasq blocklists ($TIMESTAMP) [skip ci]"
        
        # 4. Pull any remote updates using rebase to prevent conflicts, then push
        git pull --rebase origin main
        git push origin HEAD
