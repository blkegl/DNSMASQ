name: Update DNSmasq List

on:
  schedule:
    # Runs at 21:00 UTC every day (which is 3:00 AM BST)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run Aggregation Script
      run: python generate_dnsmasq.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
        # Always stage all generated dnsmasq files
        git add dnsmasq*.txt
            
        # Commit unconditionally (allows empty commits if files are identical)
        git commit --allow-empty -m "chore: auto-update dnsmasq blocklists [skip ci]"
            
        # Push to the repository
        git push
